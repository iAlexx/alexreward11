# LOOTRA Phase 21: Tailnet-only signer proxy.
# Install as /etc/nginx/conf.d/lootra-signer-tailnet.conf on the dedicated signer host.
#
# Security invariants:
# - Binds only to the signer's Tailscale IPv4.
# - The signer application itself stays on 127.0.0.1:3005.
# - Local custody-control endpoints are never forwarded.
# - Default route is deny/404.
#
server {
    listen 100.127.205.114:3005;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # Do not synthesize trusted client-IP headers toward the loopback signer.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3005;
    }

    location = /health/live {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3005;
    }

    location = /health/ready {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3005;
    }

    location = /v1/signing-identity {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3005;
    }

    location = /v1/sign-withdrawal-attempt {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3005;
    }

    # Custody-control endpoints must remain reachable only directly over loopback.
    location = /v1/local-unlock { return 404; }
    location = /v1/local-relock { return 404; }

    location / { return 404; }
}
