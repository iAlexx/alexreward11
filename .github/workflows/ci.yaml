name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: alex_rewards
          POSTGRES_PASSWORD: local-alex-rewards-only
          POSTGRES_DB: alex_rewards_phase2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alex_rewards -d alex_rewards_phase2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.2@sha256:37227fff5638322f4ebea25d6d0dc3ee50848604e82b81426f11507b3ec7d2cc
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Foundation validation
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
        run: pnpm run verify
      - name: Phase 2 migration and constraint gates
        env:
          PHASE2_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE2_MIGRATION_TESTS: '1'
        run: pnpm test:phase2
      - name: Phase 3 auth and membership gates
        env:
          PHASE3_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE3_REDIS_URL: redis://127.0.0.1:6379/0
          PHASE3_AUTH_TESTS: '1'
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pnpm test:phase3
      - name: Phase 4 ledger core gates
        env:
          PHASE4_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE4_LEDGER_TESTS: '1'
        run: pnpm test:phase4
      - name: Phase 5 reward engine gates
        env:
          PHASE5_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE5_REWARD_TESTS: '1'
        run: pnpm test:phase5
      - name: Phase 6 TON wallet ownership gates
        env:
          PHASE6_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE6_WALLET_TESTS: '1'
        run: pnpm test:phase6
      - name: Dependency vulnerability gate
        run: pnpm security:audit

  docker-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Prepare local-only environment
        run: cp .env.example .env
      - name: Start pinned full stack
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps up -d --build --wait
      - name: Run Phase 1 smoke test
        run: pnpm smoke
      - name: Show service logs after failure
        if: failure()
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps down --volumes
