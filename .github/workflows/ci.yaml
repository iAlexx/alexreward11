name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Foundation validation
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
        run: pnpm run verify
      - name: Dependency vulnerability gate
        run: pnpm security:audit

  docker-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.25.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Prepare local-only environment
        run: cp .env.example .env
      - name: Start pinned full stack
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps up -d --build --wait
      - name: Run Phase 1 smoke test
        run: pnpm smoke
      - name: Show service logs after failure
        if: failure()
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker/compose.yaml --env-file .env --profile apps down --volumes
