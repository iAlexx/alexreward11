      - name: Phase 13 Admin browser E2E
        env:
          PHASE13_ADMIN_E2E: '1'
          PHASE13_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase13_e2e
          PHASE13_ADMIN_E2E_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase13_e2e
