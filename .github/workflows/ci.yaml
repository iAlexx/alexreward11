            apps/admin-e2e/package.json \
            apps/admin-e2e/playwright.config.ts \
            apps/admin-e2e/README.md \
            apps/admin-e2e/src \
            apps/admin-e2e/tests \
            apps/admin-e2e/scripts \
            apps/admin/src/components/HighImpactCeremony.tsx \
            apps/admin/src/components/pages/FeatureFlagsPage.tsx \
