          NEXT_PUBLIC_API_BASE_URL: http://localhost:3032
        run: pnpm exec turbo run build --filter=@alex-rewards/api... --filter=@alex-rewards/admin... --filter=@alex-rewards/auth... --filter=@alex-rewards/contracts...
      - name: Architecture boundaries
        run: pnpm verify:boundaries
      - name: Phase 11 AdsGram gates
        env:
          PHASE11_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE11_ADS_TESTS: '1'
        run: pnpm test:phase11
      - name: Phase 12 gates
