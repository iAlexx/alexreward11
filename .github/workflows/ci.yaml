            apps/miniapp-e2e/package.json \
            apps/miniapp-e2e/playwright.config.ts \
            apps/miniapp-e2e/README.md \
            apps/miniapp-e2e/src \
            apps/miniapp-e2e/tests \
            apps/miniapp-e2e/scripts \
            apps/miniapp/test/phase12-authority-scenarios.test.ts
      - name: Build Phase 12 dependency graph
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3012
        run: pnpm exec turbo run build --filter=@alex-rewards/api... --filter=@alex-rewards/miniapp...
      - name: Architecture boundaries
        run: pnpm verify:boundaries
      - name: Phase 11 AdsGram gates
        env:
          PHASE11_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE11_ADS_TESTS: '1'
        run: pnpm test:phase11
      - name: Phase 12 gates
        env:
          PHASE12_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase2
          PHASE12_API_TESTS: '1'
        run: pnpm test:phase12

  # Independent Phase 12 browser E2E (Playwright) — isolated alex_rewards_phase12_e2e DB.
  # Does NOT need quality.
