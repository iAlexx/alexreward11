      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @alex-rewards/miniapp-e2e exec playwright install --with-deps chromium
      - name: Phase 12 browser E2E
        env:
          PHASE12_E2E: '1'
          PHASE12_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase12_e2e
          PHASE12_E2E_REDIS_URL: redis://127.0.0.1:6379/12
          PHASE12_E2E_API_PORT: '3012'
          PHASE12_E2E_MINIAPP_PORT: '3010'
          PHASE12_E2E_API_BASE_URL: http://127.0.0.1:3012
          PHASE12_E2E_MINIAPP_BASE_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3012
          PHASE11_DATABASE_URL: postgresql://alex_rewards:local-alex-rewards-only@127.0.0.1:5432/alex_rewards_phase12_e2e
          PHASE11_ADS_TESTS: '1'
